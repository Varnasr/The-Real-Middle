name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json records and fails if the lockfile and package.json
      # disagree. Until 2026-09-22 there was no lockfile at all, so every CI run
      # and every deploy resolved react, vite, recharts and tailwind afresh
      # inside their `^` ranges. A build that passed yesterday could fail today
      # with no commit in between, and a compromised transitive release would
      # land silently.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --accept 200,204,301,302,403,429 --exclude-mail --exclude "localhost|127.0.0.1|example.com|twitter.com|x.com|linkedin.com|facebook.com|instagram.com|t.me|wa.me|play.google.com|apps.apple.com|fonts.googleapis.com|fonts.gstatic.com|cdnjs.cloudflare.com" --timeout 30 --max-retries 2 "**/*.html" "**/*.md"
          fail: false
